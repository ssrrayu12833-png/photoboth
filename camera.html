<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth - Kamera</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#f7f1e3; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:-apple-system, Arial, sans-serif; color:#3b2f2a; padding:20px; }
  h2 { font-weight:600; margin-bottom:4px; }
  video { width:100%; max-width:480px; border-radius:12px; background:#000; }
  #status { margin-top:14px; font-size:14px; color:#8a7967; text-align:center; padding:0 16px; }
  button { margin-top:14px; padding:12px 22px; border-radius:10px; border:none; font-size:16px; background:#c9793a; color:#fff; font-weight:600; cursor:pointer; }
  button.secondary { background:#fff; color:#3b2f2a; border:1px solid #e2d7bd; margin-left:8px; }
  #joinBox { background:#fff; padding:20px; border-radius:16px; box-shadow:0 2px 8px rgba(0,0,0,0.06); text-align:center; width:100%; max-width:320px; }
  #joinBox input { text-transform:uppercase; text-align:center; font-size:22px; letter-spacing:4px; padding:10px; width:140px; border-radius:8px; border:1px solid #e2d7bd; margin-top:10px; }
</style>
</head>
<body>
<div id="joinBox">
  <h2>Masukkan Kode Room</h2>
  <p style="font-size:13px;color:#8a7967;margin:0;">Lihat kode 6 karakter di layar tablet</p>
  <br>
  <input id="roomInput" maxlength="6" placeholder="ABC123">
  <br>
  <button id="joinBtn">Sambungkan</button>
</div>

<video id="video" autoplay playsinline muted style="display:none;"></video>
<div id="status"></div>
<div id="camControls" style="display:none;">
  <button id="startCam">Aktifkan Kamera</button>
  <button id="switchCam" class="secondary" style="display:none;">Ganti Kamera (depan/belakang)</button>
</div>

<script>
const joinBox = document.getElementById('joinBox');
const roomInput = document.getElementById('roomInput');
const joinBtn = document.getElementById('joinBtn');
const statusEl = document.getElementById('status');
const video = document.getElementById('video');
const camControls = document.getElementById('camControls');
const startCamBtn = document.getElementById('startCam');
const switchCamBtn = document.getElementById('switchCam');
const captureCanvas = document.createElement('canvas');
const captureCtx = captureCanvas.getContext('2d');

let room = null;
let roomRef = null;
let currentFacing = 'environment'; // default kamera belakang, lebih jernih
let currentStream = null;

const prefill = new URLSearchParams(location.search).get('room');
if (prefill) roomInput.value = prefill.toUpperCase();

joinBtn.addEventListener('click', () => {
  const val = roomInput.value.trim().toUpperCase();
  if (val.length < 3) {
    statusEl.textContent = 'Kode belum diisi dengan benar.';
    return;
  }
  room = val;
  roomRef = db.ref('rooms/' + room);
  history.replaceState(null, '', '?room=' + room);
  joinBox.style.display = 'none';
  video.style.display = 'block';
  camControls.style.display = 'block';
  statusEl.textContent = 'Tersambung ke room ' + room + '. Tekan tombol untuk aktifkan kamera.';
});

async function openCamera(facing) {
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1440 } },
      audio: false,
    });
    currentStream = stream;
    video.srcObject = stream;
    currentFacing = facing;
    return true;
  } catch (err) {
    statusEl.textContent = 'Gagal akses kamera: ' + err.message + ' (pastikan buka lewat HTTPS dan izinkan akses kamera)';
    return false;
  }
}

startCamBtn.addEventListener('click', async () => {
  if (!roomRef) { statusEl.textContent = 'Belum tersambung ke room manapun.'; return; }
  const ok = await openCamera(currentFacing);
  if (!ok) return;
  statusEl.textContent = 'Kamera aktif (kamera belakang). Menunggu tablet mengambil foto...';
  startCamBtn.style.display = 'none';
  switchCamBtn.style.display = 'inline-block';
  startPreviewLoop();
  listenForCaptureRequest();
});

switchCamBtn.addEventListener('click', async () => {
  const next = currentFacing === 'environment' ? 'user' : 'environment';
  const ok = await openCamera(next);
  if (ok) statusEl.textContent = 'Sekarang pakai kamera ' + (next === 'environment' ? 'belakang' : 'depan') + '.';
});

let previewTimer = null;
function startPreviewLoop() {
  if (previewTimer) clearInterval(previewTimer);
  previewTimer = setInterval(() => {
    if (!video.videoWidth || !roomRef) return;
    captureCanvas.width = 400;
    captureCanvas.height = (video.videoHeight / video.videoWidth) * 400;
    captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
    roomRef.child('preview').set(captureCanvas.toDataURL('image/jpeg', 0.5))
      .catch(() => {}); // preview boleh gagal sesekali, tidak fatal
  }, 400);
}

function listenForCaptureRequest() {
  let lastTs = 0;
  let firstCall = true;
  roomRef.child('captureRequest').on('value', (snap) => {
    const ts = snap.val();
    if (firstCall) { firstCall = false; lastTs = ts || 0; return; } // abaikan nilai lama saat baru konek
    if (!ts || ts === lastTs) return;
    lastTs = ts;
    statusEl.textContent = 'Mengambil foto...';
    captureCanvas.width = video.videoWidth;
    captureCanvas.height = video.videoHeight;
    captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
    const fullDataUrl = captureCanvas.toDataURL('image/jpeg', 0.9);
    roomRef.child('capturedPhoto').set({ dataUrl: fullDataUrl, ts })
      .then(() => { statusEl.textContent = 'Foto terkirim ke tablet.'; })
      .catch(err => { statusEl.textContent = 'Gagal kirim foto: ' + err.message; });
  });
}

if (prefill) joinBtn.click();
</script>
</body>
</html>
